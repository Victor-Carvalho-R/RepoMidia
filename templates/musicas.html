{% extends 'base.html' %}

{% block head %}
<title>Músicas - RepoMidia</title>
<link rel="stylesheet" href="../static/musicas.css">
{% endblock %}


{% block base %}
<div class="main-content">
    <div class="page-header">
        <h1 class="page-title">Músicas</h1>
        <p class="page-subtitle" id="music-count">12 músicas</p>
    </div>

    <div class="music-table-container">
        <table class="music-table">
            <thead>
                <tr>
                    <th style="width: 50%;">Título</th>
                    <th style="width: 25%;">Artista</th>
                    <th style="width: 20%;">Álbum</th>
                    <th style="width: 5%; text-align: right;">Duração</th>
                </tr>
            </thead>
            <tbody id="music-list">
                {% for song in songs_table[1:] %}
                <tr data-track="{{ loop.index }}" onclick="playTrack({{ loop.index }}, '{{ song[1] }}')">
                    <td>
                        <div class="title-cell">
                            <div class="play-icon">🎵</div>
                            <div class="track-info">
                                <div class="track-title">{{ song[1] }}</div>
                            </div>
                        </div>
                    </td>
                    <td>placeholder</td>
                    <td>placeholder</td>
                    <td class="duration-cell" style="text-align: right;">placeholder</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
</div>

<!-- Player Fixo -->
<div class="player-bar">
    <div class="player-progress">
        <div class="progress-bar" onclick="seekTo(event)">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>
    <div class="player-controls-wrapper">
        <div class="player-info">
            <div class="player-thumbnail">🎵</div>
            <div class="playing-info">
                <div class="playing-title" id="playing-title">Bohemian Rhapsody</div>
                <div class="playing-artist" id="playing-artist">Queen</div>
            </div>
        </div>

        <div class="player-controls">
            <button class="control-btn" onclick="previousTrack()">⏮</button>
            <button class="control-btn play" id="play-btn" onclick="togglePlay()">▶</button>
            <button class="control-btn" onclick="nextTrack()">⏭</button>
        </div>

        <div class="player-volume">
            <span class="volume-icon">🔊</span>
            <div class="volume-slider" onclick="setVolume(event)">
                <div class="volume-fill" id="volume-fill"></div>
            </div>
        </div>
    </div>
</div>

<script src="../static/musicas.js"></script>
{% endblock %}
